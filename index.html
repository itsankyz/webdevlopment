<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Registration Form</legend>

            <label for="name">Name:</label>
            <input id="name" type="text" name="fullName" placeholder="Enter your name">
            <br><br>

            <label for="father-name">Father's Name:</label>
            <input id="father-name" type="text" name="fatherName" placeholder="Enter your father's name">
            <br><br>

            <label for="mother-name">Mother's Name:</label>
            <input id="mother-name" type="text" name="motherName" placeholder="Enter your mother's name">
            <br><br>

            <label for="password">Password:</label>
            <input id="password" type="password" name="password" placeholder="Enter password">
            <br><br>

            <label for="confirm-password">Confirm Password:</label>
            <input id="confirm-password" type="password" name="confirmPassword" placeholder="Confirm your password">
            <br><br>

            <label for="email">Email:</label>
            <input id="email" type="email" name="email" placeholder="Enter your email">
            <br><br>

            <label for="contact">Contact:</label>
            <input id="contact" type="tel" name="contact" placeholder="Enter your phone number">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input id="dob" type="date" name="dob">
            <br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
            <br><br>

            <label>Subject:</label>
            <input type="checkbox" id="maths" name="subject" value="maths">
            <label for="maths">Maths</label>

            <input type="checkbox" id="science" name="subject" value="science">
            <input type="checkbox" id="english" name="subject" value="english">
            <label for="english">English</label>
            <br><br>

            <button type="submit">Submit</button>
        </fieldset>
    </form>
</body>

</html>
