<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>complex form</title>
</head>
<body>
  <h1>complex form</h1>

  <form action="#" method="post">
    <fieldset>
      <legend>personal information</legend>

      <p>
        <label for="fullname">NAME:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your  name" required>
      </p>

      <p>
        <label for="email">EMAIL:</label>
        <input type="email" id="email" name="email" placeholder="abc@gmail.com" required>
      </p>

      <p>
        <label for="phone">PHONE:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your  Number" pattern="[0-9]{10}" maxlength="10" required>
      </p>

      <p>
        <label for="dob">DATE OF BIRTH:</label>
        <input type="date" id="dob" name="dob" required>
      </p>
      <p>
        <label for="gender">GENDER:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

      </p> 

      <p>
        <label for="country">SELECT COUNTRY</label>
        <select id="country" name="country">
          <option value="usa">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="canada">Canada</option>
          <option value="other">Other</option>
        </select>
      </p>

      
    </fieldset>

    <fieldset>
      <legend>Address</legend>

      <p>
        <label for="address">STREET:</label>
        <input type="text" id="address" name="address" placeholder="street" required>
      </p>

        <p>
            <label for="city">CITY:</label>
            <input type="text" id="city" name="city" placeholder="DELHI" required>
        </p>
        <p>
            <label for="state">STATE:</label>
            <input type="text" id="state" name="state" placeholder="DELHI" required>
        </p>
        <p>
            <label for="zip">PIN CODE:</label>
            <input type="text" id="zip" name="zip" placeholder="110001" required>
        </p>
    </fieldset>
    <fieldset>
      <legend>other information</legend>

      <label for="comments">comments:</label><br>
      <textarea id="comments" name="comments" rows="6" cols="60" placeholder=""></textarea>
      <button type="submit">SUBMIT</button>
    </fieldset>
  </form>
</body>
</html>
